version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors are upgraded deliberately, with the gate and the benchmarks run
    # against them, because they change behaviour rather than fix it — a Vite,
    # Vitest or TypeScript major has broken this build before. Dependabot still
    # opens security updates for any version.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      # One pull request for all of them, because some actions only work when
      # every step of the same action runs the same version: a lone bump of
      # `codeql-action/analyze` while `codeql-action/init` stayed behind failed
      # with "Loaded a configuration file for version 4.30.8, but running
      # version 4.38.0". Grouping is what keeps them in step.
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
