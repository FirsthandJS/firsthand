name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: false
        default: 'latest'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm Trusted Publishing over OIDC and for attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the anonymity check can look at all of it.
          fetch-depth: 0

      # Deliberately no `registry-url`. It writes an `.npmrc` containing
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token secret set that is
      # the literal string `XXXXX-XXXXX-XXXXX-XXXXX` — which npm sends, and
      # which the registry answers with a 404 for a package you may not write.
      # That is the error every release in this repository's history ended on
      # (#50). With no `.npmrc` at all there is nothing to authenticate with
      # but OIDC, which is the point.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which has no OIDC support at all: `npm publish`
      # then sends an unauthenticated PUT, and npm answers 404 for a scoped
      # package it will not let you write. That is the error every release run
      # in this repository's history has ended on (#50). Trusted Publishing
      # needs 11.5.1 or later.
      - name: Use an npm that can publish over OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run test:exports
      - run: npm run check:versions

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'packages/*/dist/**'

      # Either door, and neither is opened from this repository.
      #
      # Trusted Publishing is the one this workflow is written for: no token
      # anywhere, and provenance comes with it. It needs a trusted publisher
      # configured for each package on npmjs.com, pointing at this repository
      # and this workflow.
      #
      # A token is the other. If `NPM_TOKEN` is set as a repository secret,
      # this writes the `.npmrc` that `setup-node` used to write wrongly — with
      # the real token rather than a placeholder — and the publish below
      # authenticates with it. Provenance still comes from OIDC, so the claim
      # holds either way.
      #
      # If neither exists, the publish fails, which is the honest outcome
      # (#50).
      # The test is in the shell rather than in `if:`, because the `secrets`
      # context is not available to a step-level condition. A workflow that
      # uses it there does not fail at the step — it fails validation, so no
      # job is created at all and the run is named after the file. This one
      # did that on every push since it was written, which is why no release
      # has ever run from CI (#50).
      - name: Authenticate with a token, if one is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            echo "publishing with a token"
          else
            echo "no token: publishing over OIDC, which needs a trusted publisher"
          fi

      - name: Publish packages
        run: npm publish --workspaces --provenance --tag "${{ inputs.tag || 'latest' }}"

      # The claim, read back from the registry. `publishConfig.provenance` said
      # every release carried an attestation while none of them did, for
      # thirteen releases, because nothing ever checked (#50). A release that
      # publishes without provenance now fails here rather than passing
      # quietly.
      - name: Check the packages carry what they claim
        run: npm run check:provenance
