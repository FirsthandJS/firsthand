name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: false
        default: 'latest'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm Trusted Publishing over OIDC and for attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the anonymity check can look at all of it.
          fetch-depth: 0

      # Deliberately no `registry-url`. It writes an `.npmrc` containing
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token secret set that is
      # the literal string `XXXXX-XXXXX-XXXXX-XXXXX` — which npm sends, and
      # which the registry answers with a 404 for a package you may not write.
      # That is the error every release in this repository's history ended on
      # (#50). With no `.npmrc` at all there is nothing to authenticate with
      # but OIDC, which is the point.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which has no OIDC support at all: `npm publish`
      # then sends an unauthenticated PUT, and npm answers 404 for a scoped
      # package it will not let you write. That is the error every release run
      # in this repository's history has ended on (#50). Trusted Publishing
      # needs 11.5.1 or later.
      - name: Use an npm that can publish over OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run test:exports
      - run: npm run check:versions

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'packages/*/dist/**'

      # No NODE_AUTH_TOKEN: publishing uses npm Trusted Publishing over OIDC,
      # so there is no long-lived token to leak or rotate. Provenance is
      # attached automatically for OIDC publishes.
      - name: Publish packages
        run: npm publish --workspaces --provenance --tag "${{ inputs.tag || 'latest' }}"

      # The claim, read back from the registry. `publishConfig.provenance` said
      # every release carried an attestation while none of them did, for
      # thirteen releases, because nothing ever checked (#50). A release that
      # publishes without provenance now fails here rather than passing
      # quietly.
      - name: Check the packages carry what they claim
        run: npm run check:provenance
